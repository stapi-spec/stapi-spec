          title: Stapi Version
          type: string
        title:
          default: ''
          title: Title
          type: string
        type:
          const: Collection
          default: Collection
          title: Type
          type: string
      required:
      - id
      - license
      title: Product
      type: object
    ProductsCollection:
      properties:
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        products:
          items:
            $ref: '#/components/schemas/Product'
          title: Products
          type: array
        stapi_type:
          const: ProductCollection
          default: ProductCollection
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
      required:
      - products
      title: ProductsCollection
      type: object
    Provider:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          title: Name
          type: string
        roles:
          items:
            $ref: '#/components/schemas/ProviderRole'
          title: Roles
          type: array
        url:
          format: uri
          minLength: 1
          title: Url
          type: string
      required:
      - name
      - roles
      - url
      title: Provider
      type: object
    ProviderRole:
      enum:
      - licensor
      - producer
      - processor
      - host
      title: ProviderRole
      type: string
    RootResponse:
      properties:
        conformsTo:
          items:
            type: string
          title: Conformsto
          type: array
        description:
          default: ''
          title: Description
          type: string
        id:
          title: Id
          type: string
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        title:
          default: ''
          title: Title
          type: string
      required:
      - id
      title: RootResponse
      type: object
    SearchParameters-Input:
      description: 'STAPI Search Parameters Object.


        Shared request component constraining what could fulfill a request; used

        by both the Opportunity Request and the Order Request.

        See stapi-spec docs/spec/search-parameters/README.md.'
      properties:
        datetime:
          title: Datetime
          type: string
        filter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filter
        geometry:
          discriminator:
            mapping:
              GeometryCollection: '#/components/schemas/GeometryCollection-Input'
              LineString: '#/components/schemas/LineString'
              MultiLineString: '#/components/schemas/MultiLineString'
              MultiPoint: '#/components/schemas/MultiPoint'
              MultiPolygon: '#/components/schemas/MultiPolygon'
              Point: '#/components/schemas/Point'
              Polygon: '#/components/schemas/Polygon'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/Point'
          - $ref: '#/components/schemas/MultiPoint'
          - $ref: '#/components/schemas/LineString'
          - $ref: '#/components/schemas/MultiLineString'
          - $ref: '#/components/schemas/Polygon'
          - $ref: '#/components/schemas/MultiPolygon'
          - $ref: '#/components/schemas/GeometryCollection-Input'
          title: Geometry
      required:
      - datetime
      - geometry
      title: SearchParameters
      type: object
    SearchParameters-Output:
      description: 'STAPI Search Parameters Object.


        Shared request component constraining what could fulfill a request; used

        by both the Opportunity Request and the Order Request.

        See stapi-spec docs/spec/search-parameters/README.md.'
      properties:
        datetime:
          title: Datetime
          type: string
        filter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filter
        geometry:
          discriminator:
            mapping:
              GeometryCollection: '#/components/schemas/GeometryCollection-Output'
              LineString: '#/components/schemas/LineString'
              MultiLineString: '#/components/schemas/MultiLineString'
              MultiPoint: '#/components/schemas/MultiPoint'
              MultiPolygon: '#/components/schemas/MultiPolygon'
              Point: '#/components/schemas/Point'
              Polygon: '#/components/schemas/Polygon'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/Point'
          - $ref: '#/components/schemas/MultiPoint'
          - $ref: '#/components/schemas/LineString'
          - $ref: '#/components/schemas/MultiLineString'
          - $ref: '#/components/schemas/Polygon'
          - $ref: '#/components/schemas/MultiPolygon'
          - $ref: '#/components/schemas/GeometryCollection-Output'
          title: Geometry
      required:
      - datetime
      - geometry
      title: SearchParameters
      type: object
    StoredOrderRequest:
      description: 'Stored form of an Order Request within Order properties.


        order_parameters is typed as BaseOrderParameters because a persisted

        order can no longer be validated against a product''s strict

        OrderParameters model.'
      properties:
        order_parameters:
          $ref: '#/components/schemas/BaseOrderParameters'
        search_parameters:
          $ref: '#/components/schemas/SearchParameters-Output'
      required:
      - search_parameters
      title: StoredOrderRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
