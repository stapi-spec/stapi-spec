components:
  schemas:
    BaseOrderParameters:
      additionalProperties: true
      description: 'Minimum-expectations type for order parameters at rest.


        Permissive (extra="allow") so stored parameters from any product

        round-trip; spec-standardized common order parameters, if any are ever

        defined, get typed fields here.'
      properties: {}
      title: BaseOrderParameters
      type: object
    Conformance:
      properties:
        conformsTo:
          items:
            type: string
          title: Conformsto
          type: array
      required:
      - conformsTo
      title: Conformance
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LineString:
      description: LineString Model
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - type: 'null'
          title: Bbox
        coordinates:
          items:
            anyOf:
            - $ref: '#/components/schemas/Position2D'
            - $ref: '#/components/schemas/Position3D'
          minItems: 2
          title: Coordinates
          type: array
        type:
          const: LineString
          title: Type
          type: string
      required:
      - type
      - coordinates
      title: LineString
      type: object
    Link:
      additionalProperties: true
      properties:
        body:
          title: Body
        headers:
          additionalProperties:
            anyOf:
            - type: string
            - items:
                type: string
              type: array
          title: Headers
          type: object
        href:
          format: uri
          minLength: 1
          title: Href
          type: string
        method:
          title: Method
          type: string
        rel:
          title: Rel
          type: string
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - href
      - rel
      title: Link
      type: object
    MultiLineString:
      description: MultiLineString Model
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - type: 'null'
          title: Bbox
        coordinates:
          items:
            items:
              anyOf:
              - $ref: '#/components/schemas/Position2D'
              - $ref: '#/components/schemas/Position3D'
            minItems: 2
            type: array
          title: Coordinates
          type: array
        type:
          const: MultiLineString
          title: Type
          type: string
      required:
      - type
      - coordinates
      title: MultiLineString
      type: object
    MultiPoint:
      description: MultiPoint Model
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - type: 'null'
          title: Bbox
        coordinates:
          items:
            anyOf:
            - $ref: '#/components/schemas/Position2D'
            - $ref: '#/components/schemas/Position3D'
          title: Coordinates
          type: array
        type:
          const: MultiPoint
          title: Type
          type: string
      required:
      - type
      - coordinates
      title: MultiPoint
      type: object
    MultiPolygon:
      description: MultiPolygon Model
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - type: 'null'
          title: Bbox
        coordinates:
          items:
            items:
              items:
                anyOf:
                - $ref: '#/components/schemas/Position2D'
                - $ref: '#/components/schemas/Position3D'
              minItems: 4
              type: array
            type: array
          title: Coordinates
          type: array
        type:
          const: MultiPolygon
          title: Type
          type: string
      required:
      - type
      - coordinates
      title: MultiPolygon
      type: object
    Opportunity:
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          title: Bbox
        geometry:
          discriminator:
            mapping:
              LineString: '#/components/schemas/LineString'
              MultiLineString: '#/components/schemas/MultiLineString'
              MultiPoint: '#/components/schemas/MultiPoint'
              MultiPolygon: '#/components/schemas/MultiPolygon'
              Point: '#/components/schemas/Point'
              Polygon: '#/components/schemas/Polygon'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/Point'
          - $ref: '#/components/schemas/MultiPoint'
          - $ref: '#/components/schemas/LineString'
          - $ref: '#/components/schemas/MultiLineString'
          - $ref: '#/components/schemas/Polygon'
          - $ref: '#/components/schemas/MultiPolygon'
          title: Geometry
        id:
          title: Id
          type: string
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        properties:
          $ref: '#/components/schemas/OpportunityProperties'
        stapi_type:
          const: Opportunity
          default: Opportunity
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
        type:
          const: Feature
          default: Feature
          title: Type
          type: string
      required:
      - bbox
      - type
      - geometry
      - properties
      - stapi_type
      - stapi_version
      - links
      title: Opportunity
      type: object
    OpportunityCollection:
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          title: Bbox
        features:
          items:
            $ref: '#/components/schemas/Opportunity'
          title: Features
          type: array
        id:
          title: Id
          type: string
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        numberMatched:
          title: Numbermatched
          type: integer
        stapi_type:
          const: OpportunityCollection
          default: OpportunityCollection
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
        type:
          const: FeatureCollection
          default: FeatureCollection
          title: Type
          type: string
      required:
      - type
      - features
      - stapi_type
      - stapi_version
      - links
      title: OpportunityCollection
      type: object
    OpportunityProperties:
      additionalProperties: true
      properties:
        datetime:
          title: Datetime
          type: string
        product_id:
          title: Product Id
          type: string
      required:
      - datetime
      - product_id
      title: OpportunityProperties
      type: object
    OpportunityRequest:
      description: 'STAPI Opportunity Request Object.


        Structured the same as the Order Request Object minus order_parameters,

        so an Opportunity Request can be submitted unmodified as an Order Request.

        See stapi-spec docs/spec/opportunity/README.md#opportunity-request-object.'
      properties:
        limit:
          default: 10
          title: Limit
          type: integer
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        search_parameters:
          $ref: '#/components/schemas/SearchParameters'
      required:
      - search_parameters
      title: OpportunityRequest
      type: object
    OpportunitySearchRecord:
      properties:
        id:
          title: Id
          type: string
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        product_id:
          title: Product Id
          type: string
        request:
          $ref: '#/components/schemas/OpportunityRequest'
        stapi_type:
          const: OpportunitySearchRecord
          default: OpportunitySearchRecord
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
        status:
          $ref: '#/components/schemas/OpportunitySearchStatus'
      required:
      - id
      - product_id
      - request
      - status
      - stapi_type
      - stapi_version
      - links
      title: OpportunitySearchRecord
      type: object
    OpportunitySearchRecordCollection:
      properties:
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        numberMatched:
          title: Numbermatched
          type: integer
        records:
          items:
            $ref: '#/components/schemas/OpportunitySearchRecord'
          title: Records
          type: array
        stapi_type:
          const: OpportunitySearchRecordCollection
          default: OpportunitySearchRecordCollection
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
      required:
      - stapi_type
      - stapi_version
      - records
      - links
      title: OpportunitySearchRecordCollection
      type: object
    OpportunitySearchStatus:
      description: 'A search record status; parameterize with a StrEnum

        (``OpportunitySearchStatus[MyCodes]``) to constrain status_code to an

        implementation-defined set.'
      properties:
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        reason_code:
          title: Reason Code
          type: string
        reason_text:
          title: Reason Text
          type: string
        status_code:
          anyOf:
          - $ref: '#/components/schemas/OpportunitySearchStatusCode'
          - type: string
          title: Status Code
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - timestamp
      - status_code
      - links
      title: OpportunitySearchStatus
      type: object
    OpportunitySearchStatusCode:
      enum:
      - received
      - in_progress
      - failed
      - cancelled
      - completed
      title: OpportunitySearchStatusCode
      type: string
    OpportunitySearchStatusCollection:
      properties:
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        numberMatched:
          title: Numbermatched
          type: integer
        stapi_type:
          const: OpportunitySearchStatusCollection
          default: OpportunitySearchStatusCollection
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
        statuses:
          items:
            $ref: '#/components/schemas/OpportunitySearchStatus'
          title: Statuses
          type: array
      required:
      - stapi_type
      - stapi_version
      - statuses
      - links
      title: OpportunitySearchStatusCollection
      type: object
    Order:
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          title: Bbox
        geometry:
          discriminator:
            mapping:
              LineString: '#/components/schemas/LineString'
              MultiLineString: '#/components/schemas/MultiLineString'
              MultiPoint: '#/components/schemas/MultiPoint'
              MultiPolygon: '#/components/schemas/MultiPolygon'
              Point: '#/components/schemas/Point'
              Polygon: '#/components/schemas/Polygon'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/Point'
          - $ref: '#/components/schemas/MultiPoint'
          - $ref: '#/components/schemas/LineString'
          - $ref: '#/components/schemas/MultiLineString'
          - $ref: '#/components/schemas/Polygon'
          - $ref: '#/components/schemas/MultiPolygon'
          title: Geometry
        id:
          title: Id
          type: string
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        properties:
          $ref: '#/components/schemas/OrderProperties'
        stapi_type:
          const: Order
          default: Order
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
        type:
          const: Feature
          default: Feature
          title: Type
          type: string
      required:
      - bbox
      - id
      - type
      - stapi_type
      - stapi_version
      - geometry
      - properties
      - links
      title: Order
      type: object
    OrderCollection:
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          title: Bbox
        features:
          items:
            $ref: '#/components/schemas/Order'
          title: Features
          type: array
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        numberMatched:
          title: Numbermatched
          type: integer
        stapi_type:
          const: OrderCollection
          default: OrderCollection
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
        type:
          const: FeatureCollection
          default: FeatureCollection
          title: Type
          type: string
      required:
      - type
      - stapi_type
      - stapi_version
      - features
      - links
      title: OrderCollection
      type: object
    OrderParameters:
      additionalProperties: true
      description: 'Product-specific parameters to apply when creating an Order.


        Each Product defines its own Order Parameters JSON Schema, published at

        ``GET /products/{productId}/order-parameters``; this value must validate against

        that schema. Omitting it is equivalent to providing an empty object.'
      properties: {}
      title: OrderParameters
      type: object
    OrderProperties:
      additionalProperties: true
      properties:
        created:
          format: date-time
          title: Created
          type: string
        order_request:
          $ref: '#/components/schemas/StoredOrderRequest'
        product_id:
          title: Product Id
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
      required:
      - product_id
      - created
      - status
      - order_request
      title: OrderProperties
      type: object
    OrderRequest:
      properties:
        order_parameters:
          $ref: '#/components/schemas/OrderParameters'
        search_parameters:
          $ref: '#/components/schemas/SearchParameters'
      required:
      - search_parameters
      title: OrderRequest
      type: object
    OrderStatus:
      additionalProperties: true
      description: 'An order status; parameterize with a StrEnum (``OrderStatus[MyCodes]``)

        to constrain status_code to an implementation-defined set.'
      properties:
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        reason_code:
          title: Reason Code
          type: string
        reason_text:
          title: Reason Text
          type: string
        status_code:
          anyOf:
          - $ref: '#/components/schemas/OrderStatusCode'
          - type: string
          title: Status Code
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - timestamp
      - status_code
      - links
      title: OrderStatus
      type: object
    OrderStatusCode:
      enum:
      - received
      - accepted
      - rejected
      - completed
      - cancelled
      - scheduled
      - held
      - processing
      - reserved
      - tasked
      - user_cancelled
      - expired
      - failed
      title: OrderStatusCode
      type: string
    OrderStatusCollection:
      properties:
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        numberMatched:
          title: Numbermatched
          type: integer
        stapi_type:
          const: OrderStatusCollection
          default: OrderStatusCollection
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
        statuses:
          items:
            $ref: '#/components/schemas/OrderStatus'
          title: Statuses
          type: array
      required:
      - stapi_type
      - stapi_version
      - statuses
      - links
      title: OrderStatusCollection
      type: object
    Point:
      description: Point Model
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - type: 'null'
          title: Bbox
        coordinates:
          anyOf:
          - $ref: '#/components/schemas/Position2D'
          - $ref: '#/components/schemas/Position3D'
          title: Coordinates
        type:
          const: Point
          title: Type
          type: string
      required:
      - type
      - coordinates
      title: Point
      type: object
    Polygon:
      description: Polygon Model
      properties:
        bbox:
          anyOf:
          - maxItems: 4
            minItems: 4
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - maxItems: 6
            minItems: 6
            prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            - type: number
            type: array
          - type: 'null'
          title: Bbox
        coordinates:
          items:
            items:
              anyOf:
              - $ref: '#/components/schemas/Position2D'
              - $ref: '#/components/schemas/Position3D'
            minItems: 4
            type: array
          title: Coordinates
          type: array
        type:
          const: Polygon
          title: Type
          type: string
      required:
      - type
      - coordinates
      title: Polygon
      type: object
    Position2D:
      maxItems: 2
      minItems: 2
      prefixItems:
      - title: Longitude
        type: number
      - title: Latitude
        type: number
      title: Position2D
      type: array
    Position3D:
      maxItems: 3
      minItems: 3
      prefixItems:
      - title: Longitude
        type: number
      - title: Latitude
        type: number
      - title: Altitude
        type: number
      title: Position3D
      type: array
    Product:
      properties:
        conformsTo:
          items:
            type: string
          title: Conformsto
          type: array
        description:
          title: Description
          type: string
        id:
          title: Id
          type: string
        keywords:
          items:
            type: string
          title: Keywords
          type: array
        license:
          title: License
          type: string
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        providers:
          items:
            $ref: '#/components/schemas/Provider'
          title: Providers
          type: array
        stapi_type:
          const: Product
          default: Product
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
        title:
          default: ''
          title: Title
          type: string
        type:
          const: Collection
          default: Collection
          title: Type
          type: string
      required:
      - type
      - stapi_type
      - stapi_version
      - id
      - description
      - license
      - links
      title: Product
      type: object
    ProductCollection:
      properties:
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        numberMatched:
          title: Numbermatched
          type: integer
        products:
          items:
            $ref: '#/components/schemas/Product'
          title: Products
          type: array
        stapi_type:
          const: ProductCollection
          default: ProductCollection
          title: Stapi Type
          type: string
        stapi_version:
          default: 0.2.0
          title: Stapi Version
          type: string
      required:
      - stapi_type
      - stapi_version
      - links
      - products
      title: ProductCollection
      type: object
    Provider:
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
        roles:
          items:
            $ref: '#/components/schemas/ProviderRole'
          title: Roles
          type: array
        url:
          format: uri
          minLength: 1
          title: Url
          type: string
      required:
      - name
      title: Provider
      type: object
    ProviderRole:
      enum:
      - licensor
      - producer
      - processor
      - host
      title: ProviderRole
      type: string
    RootResponse:
      properties:
        conformsTo:
          example: &id001
          - https://stapi.example.com/v0.2.0/core
          - https://stapi.example.com/v0.2.0/order-statuses
          - https://stapi.example.com/v0.2.0/searches-opportunity
          - https://stapi.example.com/v0.2.0/searches-opportunity-statuses
          items:
            type: string
          title: Conformsto
          type: array
        description:
          default: ''
          title: Description
          type: string
        id:
          title: Id
          type: string
        links:
          items:
            $ref: '#/components/schemas/Link'
          title: Links
          type: array
        title:
          default: ''
          title: Title
          type: string
      required:
      - id
      - conformsTo
      - description
      - links
      title: RootResponse
      type: object
    SearchParameters:
      additionalProperties: true
      description: 'STAPI Search Parameters Object.


        Shared request component constraining what could fulfill a request; used

        by both the Opportunity Request and the Order Request.

        See stapi-spec docs/spec/search-parameters/README.md.'
      properties:
        datetime:
          title: Datetime
          type: string
        filter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filter
        geometry:
          discriminator:
            mapping:
              LineString: '#/components/schemas/LineString'
              MultiLineString: '#/components/schemas/MultiLineString'
              MultiPoint: '#/components/schemas/MultiPoint'
              MultiPolygon: '#/components/schemas/MultiPolygon'
              Point: '#/components/schemas/Point'
              Polygon: '#/components/schemas/Polygon'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/Point'
          - $ref: '#/components/schemas/MultiPoint'
          - $ref: '#/components/schemas/LineString'
          - $ref: '#/components/schemas/MultiLineString'
          - $ref: '#/components/schemas/Polygon'
          - $ref: '#/components/schemas/MultiPolygon'
          title: Geometry
      required:
      - datetime
      - geometry
      title: SearchParameters
      type: object
    StoredOrderRequest:
      additionalProperties: true
      description: 'Stored form of an Order Request within Order properties.


        order_parameters is typed as BaseOrderParameters because a persisted

        order can no longer be validated against a product''s strict

        OrderParameters model.'
      properties:
        order_parameters:
          $ref: '#/components/schemas/BaseOrderParameters'
        search_parameters:
          $ref: '#/components/schemas/SearchParameters'
      required:
      - search_parameters
      - order_parameters
      title: StoredOrderRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
externalDocs:
  description: STAPI Specification Documentation
  url: https://stapi-spec.github.io/stapi-spec/
info:
  contact:
    name: STAPI Specification Organization
    url: https://github.com/stapi-spec
  description: The Sensor Tasking API (STAPI) defines a JSON-based web API to query
    for spatio-temporal analytic and data products derived from remote sensing (satellite
    or airborne) providers. The specification supports both products derived from
    new tasking and products from provider archives.
  title: STAPI
  version: 0.2.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: root
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootResponse'
          description: Successful Response
      summary: Get the API landing page
      tags:
      - Root
  /conformance:
    get:
      operationId: conformance
      responses:
        '200':
          content:
            application/json:
              example:
                conformsTo: *id001
              schema:
                $ref: '#/components/schemas/Conformance'
          description: Successful Response
      summary: Get conformance urls for the API
      tags:
      - Conformance
  /orders:
    get:
      operationId: list_orders
      parameters:
      - description: Pagination token, as provided by the `next` link of a previous
          response.
        in: query
        name: next
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pagination token, as provided by the `next` link of a previous
            response.
          title: Next
      - description: The maximum number of items to return in a single page.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The maximum number of items to return in a single page.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/OrderCollection'
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The request could not be served because a backend reported
            failure.
      summary: List all Orders
      tags:
      - Orders
  /orders/{orderId}:
    get:
      description: Get details for order with `orderId`.
      operationId: get_order
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          title: Order Id
          type: string
      responses:
        '200':
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The request could not be served because a backend reported
            failure.
      summary: Get an Order by ID
      tags:
      - Orders
  /orders/{orderId}/statuses:
    get:
      operationId: list_order_statuses
      parameters:
      - in: path
        name: orderId
