          - type: string
          - type: 'null'
          description: Pagination token, as provided by the `next` link of a previous
            response.
          title: Next
      - description: The maximum number of items to return in a single page.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The maximum number of items to return in a single page.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunitySearchRecordCollection'
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The request could not be served because a backend reported
            failure.
      summary: List all Opportunity Search Records
      tags:
      - Opportunities
  /searches/opportunities/{searchRecordId}:
    get:
      description: Get the Opportunity Search Record with `searchRecordId`.
      operationId: get_opportunity_search_record
      parameters:
      - in: path
        name: searchRecordId
        required: true
        schema:
          title: Search Record Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunitySearchRecord'
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The request could not be served because a backend reported
            failure.
      summary: Get an Opportunity Search Record by ID
      tags:
      - Opportunities
  /searches/opportunities/{searchRecordId}/statuses:
    get:
      description: Get the Opportunity Search Record statuses with `searchRecordId`.
      operationId: list_opportunity_search_record_statuses
      parameters:
      - in: path
        name: searchRecordId
        required: true
        schema:
          title: Search Record Id
          type: string
      - description: Pagination token, as provided by the `next` link of a previous
