        in: query
        name: next
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pagination token, as provided by the `next` link of a previous
            response.
          title: Next
      - description: The maximum number of items to return in a single page.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The maximum number of items to return in a single page.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusCollection'
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The request could not be served because a backend reported
            failure.
      summary: List statuses for an Order
      tags:
      - Orders
  /products:
    get:
      operationId: list_products
      parameters:
      - description: Pagination token, as provided by the `next` link of a previous
          response.
        in: query
        name: next
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pagination token, as provided by the `next` link of a previous
            response.
          title: Next
      - description: The maximum number of items to return in a single page.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The maximum number of items to return in a single page.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollection'
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List all Products
      tags:
      - Products
  /products/{productId}:
    get:
      operationId: get_product
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          title: Product Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
      summary: Retrieve this product
      tags:
      - Products
  /products/{productId}/conformance:
    get:
      description: Return conformance urls of a specific product
      operationId: product_conformance
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          title: Product Id
          type: string
      responses:
