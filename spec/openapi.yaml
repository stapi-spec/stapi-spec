          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
      summary: Get conformance urls for the product
      tags:
      - Conformance
  /products/{productId}/opportunities:
    post:
      description: Explore the opportunities available for a particular set of queryables
      operationId: search_opportunities
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          title: Product Id
          type: string
      - in: header
        name: prefer
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Prefer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityRequest'
        required: true
      responses:
        '200':
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/OpportunityCollection'
          description: Successful Response
          headers:
            Preference-Applied:
              description: Which preference the server applied, sent whenever the
                request carried a `Prefer` header. It may differ from the requested
                preference when the Product cannot honour it.
              schema:
                enum:
                - respond-async
                - wait
                type: string
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunitySearchRecord'
          description: Created (async opportunity search record)
          headers:
            Location:
              description: URL of the created Opportunity Search Record.
              schema:
                format: uri
                type: string
            Preference-Applied:
              description: Which preference the server applied, sent whenever the
                request carried a `Prefer` header. It may differ from the requested
                preference when the Product cannot honour it.
              schema:
                enum:
                - respond-async
                - wait
                type: string
        '400':
          description: 'The request was rejected: e.g. it omits a predicate for a
            queryable the Product requires, or its `Prefer` header carries an unsupported
            value.'
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The request could not be served because a backend reported
            failure.
      summary: Search Opportunities for the product
      tags:
      - Opportunities
  /products/{productId}/opportunities/{opportunityCollectionId}:
    get:
      description: Fetch an opportunity collection generated by an asynchronous opportunity
        search.
      operationId: get_opportunity_collection
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          title: Product Id
          type: string
      - in: path
        name: opportunityCollectionId
        required: true
        schema:
          title: Opportunity Collection Id
          type: string
      - description: Pagination token, as provided by the `next` link of a previous
          response.
        in: query
        name: next
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pagination token, as provided by the `next` link of a previous
            response.
          title: Next
      - description: The maximum number of items to return in a single page.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: The maximum number of items to return in a single page.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/OpportunityCollection'
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The request could not be served because a backend reported
            failure.
      summary: Get an Opportunity Collection by ID
      tags:
      - Opportunities
  /products/{productId}/order-parameters:
    get:
      description: Return supported order parameters of a specific product
      operationId: get_order_parameters
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          title: Product Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
      summary: Get order parameters for the product
      tags:
      - Products
  /products/{productId}/orders:
    post:
      operationId: create_order
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          title: Product Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
        required: true
      responses:
        '201':
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
          headers:
            Location:
              description: URL of the created Order.
              schema:
                format: uri
                type: string
        '400':
          description: 'The request was rejected: e.g. it omits a predicate for a
            queryable the Product requires, or its `Prefer` header carries an unsupported
            value.'
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The request could not be served because a backend reported
            failure.
      summary: Create an order for the product
      tags:
      - Orders
  /products/{productId}/queryables:
    get:
      description: Return supported queryables of a specific product
      operationId: get_queryables
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          title: Product Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Successful Response
        '404':
          description: The requested resource does not exist or is not accessible,
            or the supplied pagination token does not identify a page.
      summary: Get queryables for the product
      tags:
      - Products
  /searches/opportunities:
    get:
      operationId: list_opportunity_search_records
      parameters:
      - description: Pagination token, as provided by the `next` link of a previous
